name: Dependency Vulnerability Scan

# Two ecosystem-native scanners, kept apart from osv-scanner.yml because they answer a different
# question.
#
# OSV-Scanner reads the lock files and asks one database, OSV.dev, about what is in them. These two
# ask their own toolchains instead: the Go team's govulncheck walks the call graph and reports a CVE
# only when the vulnerable symbol is actually reachable, and `dotnet list package --vulnerable`
# queries the GitHub Advisory Database through NuGet itself. Between them they see things a generic
# SCA pass does not -- a different advisory source on the .NET side, and on the Go side *fewer*
# things, deliberately, because a vulnerability in a package whose code this project never calls is
# not a live failure path.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Offset from the OSV-Scanner and CodeQL schedules so a bad Sunday morning does not arrive as
    # three simultaneous failures with no clue which one moved.
    - cron: '30 3 * * 0'

# Third-party actions are pinned to commit SHAs, not tags. A tag is mutable: whoever controls the
# action's repo can repoint it at new code that then runs inside this job with the repo checked out.
# The trailing comment records which version each SHA was, since the SHA alone is unreadable.
#
# Both jobs report to code scanning, for the reason osv-scanner.yml gives: a finding that exists only
# in a job log has no history, cannot be dismissed with a reason, and is gone when the log ages out.
# Neither of these tools emits usable SARIF on its own -- govulncheck needs its paths rewritten and
# the NuGet side has no SARIF output at all -- so both jobs below build it by hand.
#
# The write that needs is granted per job rather than here. It reads as a distinction without a
# difference while both jobs happen to want it, and stops being one the moment a third job is added:
# a workflow-level grant is inherited by everything, including whatever gets added later by someone
# who never thought about it.
permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the only place the Go version is written down; setup-go v6 runs
          # GOTOOLCHAIN=local, so a second pin here would drift and then fail.
          go-version-file: src/OnePasswordNative/go.mod
          cache-dependency-path: src/OnePasswordNative/go.sum

      # Pinned rather than @latest. Everything else in these workflows is pinned so that what runs
      # changes when this file says so; a tool installed at @latest is the one hole in that, and it
      # is a tool being handed the source tree.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      # SARIF pass, uploaded below; the gate re-runs it for a readable log. `|| true` because
      # govulncheck's exit code depends on its output format and this step must not be what fails
      # the build -- the gate is.
      #
      # The path rewrite is required, not cosmetic. govulncheck has to run inside the module, so the
      # file URIs it emits are relative to src/OnePasswordNative, while code scanning resolves every
      # SARIF path against the repository root. Uploaded unrewritten, an alert in main.go anchors to
      # a main.go at the top of the repo, which does not exist -- GitHub then drops the location and
      # the alert points nowhere. Absolute and http URIs are left alone; so is a path that already
      # carries the prefix, so this stays correct if govulncheck ever changes what it emits.
      - name: Run govulncheck (SARIF, for code scanning)
        working-directory: src/OnePasswordNative
        run: govulncheck -format sarif ./... > govulncheck.raw.sarif || true

      - name: Rewrite SARIF paths to be repository-relative
        run: |
          jq 'walk(
                if type == "object"
                   and ((.uri // null) | type) == "string"
                   and ((.uri | startswith("src/OnePasswordNative/")) | not)
                   and ((.uri | startswith("/")) | not)
                   and ((.uri | test("^[a-z][a-z0-9+.-]*:")) | not)
                then .uri = "src/OnePasswordNative/" + .uri
                else .
                end
              )' src/OnePasswordNative/govulncheck.raw.sarif > govulncheck.sarif

      # Uploaded even when it found nothing. An empty run is what tells code scanning that a
      # previously reported vulnerability is gone; skipping the upload leaves the old alert open
      # forever.
      - name: Upload govulncheck SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: govulncheck.sarif
          category: 'govulncheck'

      # Exits non-zero when it finds a reachable vulnerability, so no result parsing is needed --
      # unlike the .NET side below, which reports and then exits 0 regardless.
      - name: Run govulncheck
        if: always()
        working-directory: src/OnePasswordNative
        run: govulncheck ./...

  dotnet-vulnerable:
    name: dotnet list --vulnerable (NuGet)
    # windows-latest because the target framework is net10.0-windows10.0.19041.0; a restore on Linux
    # cannot resolve the Windows SDK targeting packs, and this command needs a completed restore.
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Not --locked-mode. The lock files are the thing being audited, and a restore that refuses to
      # run because one has drifted would report a lock-file problem as a security pass.
      - name: Restore
        run: dotnet restore RavensPort.slnx

      # --include-transitive is the whole point. Without it this reports only what the csproj files
      # declare, which is a handful of packages; the vulnerabilities that matter arrive underneath
      # YARP, IdentityModel.OidcClient and the Google auth libraries, none of which are declared here.
      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          $raw = dotnet list RavensPort.slnx package --vulnerable --include-transitive --format json | Out-String
          Write-Host $raw

          # This command reports and then exits 0 whether or not it found anything, so the gate has
          # to be built by hand. Silently trusting its exit code would make this step decorative.
          $report = $raw | ConvertFrom-Json

          # A project with nothing vulnerable is emitted as a bare { "path": ... } with no
          # "frameworks" key at all, so every level here has to tolerate being absent.
          $findings = foreach ($project in $report.projects) {
            foreach ($framework in @($project.frameworks)) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                foreach ($vulnerability in @($package.vulnerabilities)) {
                  if ($null -eq $package.id) { continue }
                  [pscustomobject]@{
                    Project  = [System.IO.Path]::GetFileName($project.path)
                    Package  = $package.id
                    Version  = $package.resolvedVersion
                    Severity = $vulnerability.severity
                    Advisory = $vulnerability.advisoryurl
                    # Kept alongside the display name because the SARIF below needs the full path
                    # to relativize; the table prints Project instead.
                    ProjectPath = $project.path
                  }
                }
              }
            }
          }

          # SARIF, assembled by hand. `dotnet list package` has no SARIF formatter and there is no
          # NuGet-side tool that produces one, so the alternative was leaving these findings in the
          # log only -- which is what every other scanner here has now stopped doing.
          #
          # A package has no line to point at, so each result anchors to line 1 of the project file
          # that pulled it in. That is the actionable location anyway: the fix is a version bump in
          # a csproj, or in whatever declares the package above it.
          $level = @{ 'Critical' = 'error'; 'High' = 'error'; 'Moderate' = 'warning'; 'Low' = 'note' }

          $results = foreach ($finding in $findings) {
            # Absolute on the runner; code scanning resolves SARIF paths against the repository
            # root, so anything absolute would silently fail to anchor. Trimmed by hand rather than
            # with Path.GetRelativePath, which does not exist on Windows PowerShell -- this step
            # runs under pwsh and would work, but the failure if that ever changed is a null uri
            # and a SARIF that uploads clean with every alert pointing nowhere.
            $relative = $finding.ProjectPath
            if ($relative.StartsWith($env:GITHUB_WORKSPACE, [StringComparison]::OrdinalIgnoreCase)) {
              $relative = $relative.Substring($env:GITHUB_WORKSPACE.Length)
            }
            $relative = $relative.TrimStart('\', '/').Replace('\', '/')
            @{
              ruleId  = 'nuget/vulnerable-package'
              level   = if ($level.ContainsKey($finding.Severity)) { $level[$finding.Severity] } else { 'warning' }
              message = @{ text = "$($finding.Package) $($finding.Version) has a known $($finding.Severity) severity vulnerability. See $($finding.Advisory)." }
              locations = @(@{
                physicalLocation = @{
                  artifactLocation = @{ uri = $relative }
                  region           = @{ startLine = 1 }
                }
              })
              # Keyed on the advisory and the exact version rather than the location, so bumping an
              # unrelated dependency does not close and reopen this alert, and so the same advisory
              # reported against two projects stays two alerts.
              partialFingerprints = @{ 'packageAdvisory/v1' = "$($finding.Package)@$($finding.Version)|$($finding.Advisory)" }
            }
          }

          $sarif = @{
            '$schema' = 'https://json.schemastore.org/sarif-2.1.0.json'
            version   = '2.1.0'
            runs      = @(@{
              tool = @{ driver = @{
                name           = 'dotnet list package --vulnerable'
                informationUri = 'https://learn.microsoft.com/nuget/consume-packages/dotnet-list-package'
                rules          = @(@{
                  id               = 'nuget/vulnerable-package'
                  name             = 'VulnerablePackage'
                  shortDescription = @{ text = 'Vulnerable NuGet package' }
                  fullDescription  = @{ text = 'A NuGet package in this project''s dependency graph, direct or transitive, has a known vulnerability in the GitHub Advisory Database.' }
                  helpUri          = 'https://github.com/advisories'
                })
              } }
              results = @($results)
            })
          }

          # Depth matters: the default of 2 silently truncates the nested location objects into
          # strings, and the upload then fails schema validation with nothing pointing at why.
          #
          # `shell: pwsh` above is load-bearing on the clean run, too. Windows PowerShell serialises
          # an empty array as "" rather than [], which would make the no-findings SARIF invalid --
          # exactly the upload that exists to close alerts for packages that have been fixed.
          $sarif | ConvertTo-Json -Depth 12 | Set-Content dotnet-vulnerable.sarif -Encoding utf8

          if (-not $findings) {
            Write-Host 'No vulnerable NuGet packages, transitive included.'
            exit 0
          }

          $findings | Select-Object Project, Package, Version, Severity, Advisory | Format-Table -AutoSize | Out-String | Write-Host

          # Gated on High and Critical, with everything else reported rather than hidden. A Moderate
          # advisory in a transitive package is worth seeing and is not worth blocking a merge on;
          # burying it would be, which is what a severity filter on the output would have done.
          $blocking = @($findings | Where-Object { $_.Severity -in @('High', 'Critical') })
          if ($blocking.Count -gt 0) {
            Write-Host "::error::$($blocking.Count) High/Critical vulnerable package(s) found."
            exit 1
          }

          Write-Host "$($findings.Count) advisory(ies) found, none High or Critical. Not failing the build."

      # always(), because the step above exits 1 on a High or Critical finding and those are exactly
      # the alerts worth having. An empty SARIF is uploaded too: that is what closes an alert for a
      # package that has since been bumped.
      - name: Upload dotnet SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: dotnet-vulnerable.sarif
          category: 'dotnet-vulnerable'
