name: Snyk

# Snyk Open Source over every project in the tree -- both .NET and Go, including the test project.
#
# This exists because the Snyk SCM integration does not see all of them. Importing this repository
# through Snyk's UI detects three manifests -- the two src csproj files and src/OnePasswordNative/
# go.mod -- and silently omits tests/RavensPort.Core.Tests/RavensPort.Core.Tests.csproj. The
# importer skips directories whose names look like test directories, which is a sensible default
# for a project whose tests pull in nothing the shipped code does not, and the wrong default here:
# the test project restores xunit, Microsoft.AspNetCore.Mvc.Testing and the ASP.NET Core hosting
# stack, none of which appear under src/, and an advisory against any of them is invisible to
# every other scanner pointed at this repo.
#
# The exclusion is a property of Snyk's importer, not of anything in this repository, so it cannot
# be fixed from here -- a .snyk policy file only excludes paths, it cannot un-exclude one. Running
# the CLI is what makes the coverage explicit and reviewable: --all-projects walks the tree and
# tests every project file it finds, with no opinion about what a directory is named.
#
# Overlap with the scanners already here is deliberate and is the point. OSV-Scanner asks OSV.dev,
# dependency-scan.yml asks the GitHub Advisory Database through NuGet, and Snyk asks its own
# curated database, which carries advisories the other two do not and grades severity differently.
# Three databases over the same lock files is the coverage; one of them missing a whole project is
# the gap this closes.
#
# The Go module is scanned here too, alongside the govulncheck pass in dependency-scan.yml, and the
# two answer different questions rather than the same one twice. govulncheck walks the call graph
# and reports an advisory only when the vulnerable symbol is reachable from this build -- which is
# why it stays silent about the five graph-only pins documented in src/OnePasswordNative/go.mod.
# Snyk reports on the module graph and on the *standard library*, which govulncheck covers only for
# reachable symbols and OSV-Scanner does not resolve at all. A Go stdlib advisory is a real finding
# here: the DLL is built with whatever toolchain CI hands it.
#
# That last point makes the Go toolchain version load-bearing in this job. Snyk resolves std/* from
# the toolchain that is installed, not from the `go` line in go.mod, so a runner one patch behind
# reports stdlib advisories that go.mod has already raised past. setup-go below reads the version
# out of go.mod for exactly that reason -- see the step's own note.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # The next contiguous slot: 01:30 CodeQL, 02:30 OSV-Scanner, 03:30 dependency-scan, 04:30
    # zizmor, 05:30 DevSkim, 06:30 installer-scan, 07:30 here. Offset for the reason
    # dependency-scan.yml gives -- simultaneous failures do not say which one moved.
    #
    # Weekly for the reason osv-scanner.yml gives: the tree does not change between runs, the
    # advisory database does, and an advisory published against a long-pinned package is invisible
    # until something re-asks.
    - cron: "30 7 * * 0"

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk Open Source (.NET + Go)
    # windows-latest for the reason dependency-scan.yml gives: the target framework is
    # net10.0-windows10.0.19041.0, a restore on Linux cannot resolve the Windows SDK targeting
    # packs, and Snyk's .NET scanning reads the restore output rather than the csproj alone.
    runs-on: windows-latest
    permissions:
      contents: read
      # upload-sarif. Findings belong in the Security tab, where they have history and can be
      # dismissed with a reason, rather than only in a log that ages out.
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to the repo, so don't leave GITHUB_TOKEN sitting in
          # .git/config where any later step or action could read it.
          persist-credentials: false

      # Named rather than left to fail somewhere inside the scan. Without the token the CLI exits
      # with an authentication error several steps later, which reads as a broken workflow rather
      # than as a repository that has never been given the secret.
      - name: Check for SNYK_TOKEN
        shell: pwsh
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SNYK_TOKEN)) {
            Write-Host "::error::SNYK_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # go-version-file rather than a pinned version here, matching dependency-scan.yml: go.mod is
      # the only place the Go version is written down, and a second pin would drift and then fail.
      #
      # It matters more in this job than in that one. Snyk resolves standard-library advisories
      # against the *installed* toolchain, so whatever setup-go puts on the runner is what gets
      # graded -- a runner behind go.mod's `go` line reports stdlib CVEs that this repository has
      # already moved past. Reading the version out of go.mod makes the two agree by construction.
      # Confirmed against a local run: a machine on go1.26.5 reported three High stdlib advisories
      # (std/net, std/net/http, std/net/url) that go 1.26.6, which go.mod requires, already fixes.
      # Re-running the same command with GOTOOLCHAIN=go1.26.6 returned all seven projects clean.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/OnePasswordNative/go.mod
          cache-dependency-path: src/OnePasswordNative/go.sum

      # Not --locked-mode, for the reason dependency-scan.yml gives: the lock files are the thing
      # being audited, and a restore that refuses to run because one has drifted would report a
      # lock-file problem as a security pass.
      #
      # The solution, so all three projects restore -- including the test project, which is the
      # whole reason this workflow exists. Snyk reads obj/project.assets.json for the resolved
      # transitive graph; without a restore it sees only what each csproj declares directly.
      - name: Restore
        run: dotnet restore RavensPort.slnx

      # Deliberately not snyk/actions. That action is published only as a floating branch ref, and
      # everything else in these workflows is pinned so that what runs changes when this file says
      # so -- see the note in osv-scanner.yml. Installing the CLI directly is one fewer thing to
      # trust, and makes the version visible here rather than inside somebody else's repo.
      #
      # The published binary rather than `npm install -g snyk`, following osv-scanner.yml exactly.
      # zizmor's adhoc-packages audit flags an npm global install at high confidence, and pinning
      # the version does not clear it -- the audit is about installing outside a lockfile at all,
      # which is a fair description of what `npm -g` does: it resolves snyk's own dependency tree
      # fresh at job time, so the pin covers one package out of the thirty-one that actually run.
      # A single binary has no tree to resolve.
      #
      # Pinned by version *and* by digest, for the reason osv-scanner.yml gives: the version alone
      # makes the run reproducible, the digest is what makes it verifiable, because a release asset
      # on GitHub can be deleted and re-uploaded under the same tag by whoever holds the repo.
      # Bumping the version without bumping the digest is a deliberate hard failure. The digest is
      # Snyk's own published snyk-win.exe.sha256 for this tag, checked against the downloaded file.
      #
      # Pinned rather than floating, unlike the Trivy binary osv-scanner.yml replaced. Staleness is
      # the trade and it is smaller than it looks: Snyk's value is its curated database, queried
      # live at scan time and current however old the binary is. What the version controls is which
      # project formats the CLI can parse -- .slnx is new enough for that to matter -- so bump this
      # deliberately.
      #
      # 1.1306.4 verified against this tree: it resolves all three csproj files and go.mod, and
      # reports the test project the SCM integration omits.
      #
      # Downloaded into the workspace rather than onto $PATH. This step runs under bash and the scan
      # steps under pwsh, so anything written to $GITHUB_PATH would have to be a path both accept --
      # and $RUNNER_TEMP is a Windows path that MSYS sha256sum would receive with mixed separators.
      # Both shells already run with the workspace as their working directory, so a bare ./snyk.exe
      # needs no conversion in either. Snyk reads manifests, so an extra exe sitting in the tree
      # during the scan changes nothing it reports.
      - name: Install Snyk CLI
        shell: bash
        env:
          SNYK_VERSION: v1.1306.4
          SNYK_SHA256: 45e0a8f6f451b471e86e7d94ed9622e53b66f92b7e2bcc1a0680d3306f256296
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output snyk.exe \
            "https://github.com/snyk/cli/releases/download/${SNYK_VERSION}/snyk-win.exe"
          echo "${SNYK_SHA256}  snyk.exe" | sha256sum --check --strict
          ./snyk.exe --version

      # Two passes over the same projects, for the reason osv-scanner.yml gives: this one reports
      # to the Security tab and must never be the thing that fails the build, and the gate below is
      # what enforces anything. `|| true` because the CLI exits non-zero on findings and the upload
      # has to happen regardless.
      #
      # --all-projects is the fix. It walks the tree and tests every project file it finds -- three
      # csproj files and go.mod -- so the test project is scanned on the same terms as the two
      # under src/, which is exactly what the SCM import does not do.
      #
      # Nothing is excluded. An earlier draft dropped src/OnePasswordNative on the grounds that
      # govulncheck already covers it; that was wrong twice over. govulncheck answers a narrower
      # question by design (reachable symbols only), and it is not a Snyk database, which is the
      # whole reason this job exists. The cost is accepted rather than unnoticed: a Go toolchain
      # problem can now fail a job that also gates NuGet, and the log names which project failed.
      - name: Run Snyk (SARIF, for code scanning)
        shell: pwsh
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          .\snyk.exe test --all-projects --sarif-file-output=snyk.sarif
          # Explicit, because GitHub's pwsh wrapper exits with $LASTEXITCODE and the CLI returns 1
          # whenever it found anything. The gate below is what decides whether that matters.
          exit 0

      # Uploaded even when it found nothing, for the reason dependency-scan.yml gives: an empty run
      # is what tells code scanning that a previously reported finding is gone, and skipping the
      # upload leaves the old alert open forever.
      - name: Upload Snyk SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: snyk.sarif
          # Its own bucket, so an OSV-Scanner, CodeQL or dotnet-vulnerable run never looks like it
          # resolved a Snyk finding or the other way round.
          category: "snyk"

      # The gate, set between the two thresholds already in this repository. OSV-Scanner gates on
      # any advisory at all because it reads pinned lock files and the tree is clean; the NuGet pass
      # in dependency-scan.yml gates on High and Critical only. Medium here means a Moderate
      # advisory in a transitive package blocks a merge rather than being left to be noticed in the
      # Security tab, and Low still only reports.
      #
      # One threshold over both ecosystems, which is a real decision now that Go is in scope. The
      # graph-only pins in go.mod exist because scanners read the module graph, so raising one is
      # already the routine answer here; an advisory against a module in that graph will fail this
      # job even though govulncheck calls it unreachable, and the fix is the same `go get` the
      # go.mod comment spells out. Medium rather than High makes that a more frequent event -- the
      # trade taken deliberately, since the fix is one line and the alternative is a known advisory
      # sitting in the graph until somebody reads an alert.
      - name: Run Snyk (gate)
        if: always()
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: pwsh
        run: .\snyk.exe test --all-projects --severity-threshold=medium
