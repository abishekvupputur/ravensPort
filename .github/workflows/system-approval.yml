name: System Approval

# The one suite that touches a real 1Password vault.
#
# Everything in pr.yml runs against an InMemoryVault and is free of side effects, which is why it
# can run on every push with nothing to coordinate. This cannot: it opens an actual vault with a
# service-account token and erases every RavensPort item it finds, because "the vault is empty at
# startup" is the first thing it asserts. Three consequences shape this file.
#
#   It is its own workflow, not a step in pr.yml. The job below needs a concurrency group and a
#   secret; bolting that onto the build-and-test job would put both on work that neither needs.
#
#   It is serialised globally. The concurrency group has no ref in it deliberately -- two pull
#   requests running at once would clear and seed the same vault at the same time and produce
#   failures that belong to neither of them. One run at a time, repository-wide.
#
#   It degrades to skipped rather than failing when the secret is absent. Pull requests from forks
#   get no secrets, so the token is empty, so RequiresServiceAccountFact skips and the job passes
#   green having proved nothing. That is the correct outcome for a fork: the alternative is a red
#   check on every outside contribution for a credential they were never going to have.
#
# The vault the token reaches must be a throwaway. VaultConstants.VaultName is the constant
# "RavensPort", so the token is what decides which account is touched -- there is no setting for it.
# See tests/RavensPort.SystemTests/README.md.
#
# No schedule, unlike every scanner in this directory, and the difference is the point. Those run
# weekly because what they check lives outside the repository: the tree does not change between
# runs, the advisory database does, and an advisory published on Tuesday against a year-old pin is
# invisible until something re-asks. This suite has no such input. It exercises this code against
# this vault, so a weekly run would re-prove what the last push already proved and erase the vault
# to do it. Push, pull request, and a manual dispatch when someone wants one.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# No ref in the group, on purpose: this serialises every run in the repository, not every run on a
# branch. cancel-in-progress stays false because a cancelled run leaves the vault half-seeded, and
# the next run would then be asserting against someone else's wreckage rather than a clean start.
concurrency:
  group: system-approval-vault
  cancel-in-progress: false

jobs:
  approval:
    name: System Approval
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to the repo, so don't leave GITHUB_TOKEN sitting in
          # .git/config where any later step or action could read it.
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/OnePasswordNative/go.mod
          # Off for the reason installer-scan.yml gives: a cache entry that changed what got built
          # would have this pass against something other than what ships.
          cache: false

      - name: Restore
        run: dotnet restore tests/RavensPort.SystemTests/RavensPort.SystemTests.csproj

      # The 1Password SDK is a Go c-shared library, not a NuGet package, so nothing restores it.
      # Without it the suite fails at the first vault call with "Unable to load DLL
      # 'onepassword.dll'", which reads like a bad token and is not one -- this is the only test in
      # the repository that reaches the native client at all, so it is the only one that needs this.
      - name: Build Go DLL
        shell: pwsh
        run: |
          cd src/OnePasswordNative
          $env:CGO_ENABLED = "1"
          go build -buildmode=c-shared -o onepassword.dll main.go
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Whether the suite is about to run for real, decided before it runs and recorded as an
      # output rather than inferred afterwards.
      #
      # This matters because of how this workflow degrades. On a fork PR the secrets are empty,
      # every test reports Skipped, and the job passes green -- which is the right outcome for a
      # fork, but it means "the job succeeded" says nothing about whether any vault code executed.
      # A skipped run still emits a Cobertura report; it is simply all zeroes. Merging that into the
      # combined figure would be harmless arithmetic (a union with nothing is unchanged) and
      # thoroughly misleading presentation, because the summary would claim the system half was
      # included when it contributed no lines at all.
      #
      # So the upload below is conditioned on this, and coverage.yml reports "system suite did not
      # run" when the artifact is absent. Neither variable is echoed; only whether both are set.
      - name: Check whether the suite can run
        id: gate
        shell: pwsh
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          RAVENSPORT_SYSTEM_TEST_ACK: ${{ secrets.RAVENSPORT_SYSTEM_TEST_ACK }}
        run: |
          $ready = -not ([string]::IsNullOrWhiteSpace($env:OP_SERVICE_ACCOUNT_TOKEN) -or
                         [string]::IsNullOrWhiteSpace($env:RAVENSPORT_SYSTEM_TEST_ACK))
          "ready=$($ready.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "System suite will run: $ready"

      # Named rather than inherited from the job, so the token is on exactly one step. It is a
      # bearer credential for a whole 1Password account: the fewer steps that can see it, the fewer
      # places it can be printed from.
      #
      # The acknowledgement is a repository secret rather than a literal here for one reason -- it
      # is the switch that lets this erase a vault, and it should be revocable from the same place
      # the token is. Clearing it turns this workflow into a skip without touching the file.
      - name: Run the system approval suite
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          RAVENSPORT_SYSTEM_TEST_ACK: ${{ secrets.RAVENSPORT_SYSTEM_TEST_ACK }}

          # A vault name and a mock endpoint: neither is sensitive, so both belong in Variables
          # rather than Secrets, where they can be read back and corrected without being retyped
          # blind. Read from secrets as well, because a name is an easy thing to have already put
          # there, and an empty vars entry is falsy so the fallback costs nothing.
          #
          # Both are optional. Without the first the suite uses VaultConstants.VaultName, which is
          # right until the vault's Config stamp goes missing; without the second it uses
          # Beeceptor's shared sandbox.
          RAVENSPORT_SYSTEM_TEST_VAULT: >-
            ${{ vars.RAVENSPORT_SYSTEM_TEST_VAULT || secrets.RAVENSPORT_SYSTEM_TEST_VAULT }}

          # A second service account, on its own vault, and optional. 1Password rate-limits vault
          # writes per account and a pass spends a couple of dozen, so consecutive runs against one
          # account run it out. With two, the suite picks whichever vault has gone longest without
          # being written, which halves the rate either account sees. Leave both blank for one.
          #
          # Numbering must be contiguous: the suite stops at the first missing token, so a typo in
          # the second would silently mean "there is no second account" rather than failing.
          OP_SERVICE_ACCOUNT_TOKEN_2: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_2 }}
          RAVENSPORT_SYSTEM_TEST_VAULT_2: >-
            ${{ vars.RAVENSPORT_SYSTEM_TEST_VAULT_2 || secrets.RAVENSPORT_SYSTEM_TEST_VAULT_2 }}
          RAVENSPORT_SYSTEM_TEST_OAUTH_TOKEN_ENDPOINT: >-
            ${{ vars.RAVENSPORT_SYSTEM_TEST_OAUTH_TOKEN_ENDPOINT || secrets.RAVENSPORT_SYSTEM_TEST_OAUTH_TOKEN_ENDPOINT }}
        # Coverage settings come from coverlet.runsettings, the same file pr.yml points its run at.
        # The two suites cover one assembly from opposite ends and coverage.yml merges them, which
        # only produces a meaningful union if both halves were instrumented under identical rules.
        #
        # -f, and it is load-bearing rather than tidiness. The project names both frameworks so that
        # a locked restore succeeds on the Linux job too, and `dotnet test` without a framework runs
        # every one of them — which for this suite means opening the same real 1Password vault twice
        # in one job. The two runs raced, the first wiped what the second had seeded, and the whole
        # thing failed on stage 1 before passing on the retry. It is serialised repository-wide for
        # exactly this reason; the serialisation cannot see two runs inside one invocation.
        run: >
          dotnet test tests/RavensPort.SystemTests/RavensPort.SystemTests.csproj
          -f net10.0-windows10.0.19041.0
          -c Release --no-restore --verbosity normal
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/coverage-system

      # Uploaded only when the suite actually opened a vault, and then even if it failed: a failing
      # approval run still executed real vault code on the way to failing, and that is exactly the
      # coverage someone reading the failure wants to see.
      - name: Upload system coverage
        if: always() && steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-system
          path: TestResults/coverage-system/**/*.cobertura.xml
          retention-days: 7
          if-no-files-found: error
