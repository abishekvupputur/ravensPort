name: Test, build, and release

# Runs when a version tag is pushed (e.g. `git tag v1.2.0 && git push origin v1.2.0`):
# test -> (if tests pass) build+publish -> create a GitHub release with the installer attached,
# named after the tag. Windows-only runner because this is a net10.0-windows WPF app; it cannot
# build on Linux/macOS runners.
#
# Two release assets: the installer, and the MSIX package uploaded to the Microsoft Store. The bare
# self-contained exe used to ship beside them, but running it installed nothing — no Add or Remove
# Programs entry, no Start menu shortcut — which is exactly what failed Store certification, so
# offering it as a download only invited people back into that state. Nothing builds it now.
#
# Ordinary pushes to main no longer trigger this — cutting a release is now a deliberate
# action (push a tag), not a side effect of every commit.
on:
  push:
    tags: ["v*"]

# Third-party actions are pinned to commit SHAs, not tags. A tag is mutable: whoever controls
# the action's repo can repoint v4 at new code, which would then run inside a job that holds
# contents:write on this repo and produces the binary users download. The trailing comment
# records which version each SHA was, since the SHA alone is unreadable.
#
# Read-only by default; the one job that needs to publish opts in below, so any job added
# later starts with no write access rather than inheriting it.
permissions:
  contents: read

jobs:
  test-build-release:
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload the asset
      id-token: write # OIDC token used to sign the build provenance attestation
      attestations: write # publish that attestation to the repo

    # Handed to the winget-manifests job below, which cannot recompute any of them: it runs on a
    # different runner with no access to this one's build output.
    outputs:
      version: ${{ steps.version.outputs.version }}
      setupName: ${{ steps.hash.outputs.setupName }}
      sha256: ${{ steps.hash.outputs.sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release is published through the GitHub API by the steps below, not by a
          # git push, so nothing needs credentials in .git/config — and this job holds
          # contents:write, which makes a token left lying there the worst one to leak.
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the only place the Go version is written down. Pinning it here as
          # well drifts: setup-go v5 hid that by letting the toolchain download whatever
          # go.mod asked for, and v6 runs GOTOOLCHAIN=local, so a stale pin now fails.
          go-version-file: src/OnePasswordNative/go.mod
          # The module lives under src/, so the default repository-root lookup finds no
          # go.sum and the module cache is silently skipped.
          cache-dependency-path: src/OnePasswordNative/go.sum

      # --locked-mode fails the build if a resolved package does not match packages.lock.json,
      # so a dependency (or a transitive one) changing content under a version we already
      # shipped is caught here rather than ending up in a release binary.
      - name: Restore
        run: dotnet restore RavensPort.slnx --locked-mode

      - name: Test Go DLL
        shell: pwsh
        run: |
          cd src/OnePasswordNative
          go test
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Go DLL
        shell: pwsh
        run: |
          cd src/OnePasswordNative
          $env:CGO_ENABLED = "1"
          go build -buildmode=c-shared -o onepassword.dll main.go
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # A failing test step stops the job here (default GitHub Actions behavior) — later
      # steps simply never run, which is the "if tests succeed then build" requirement.
      - name: Test
        run: dotnet test tests/RavensPort.Core.Tests/RavensPort.Core.Tests.csproj -c Release --no-restore --verbosity normal

      # Uncompressed on purpose, because this exists only as the installer's payload. LZMA2 cannot
      # improve on an already-deflated blob: compressing single-file's own 99 MB output produced a
      # 101.6 MB installer, over the 100 MB limit GitHub enforces on files in a repository -- which
      # the Store submission depends on, because it needs a redirect-free raw.githubusercontent.com
      # URL. Handing LZMA2 the raw 243 MB payload instead gives 67.9 MB, and skips the runtime
      # self-extraction step as well.
      - name: Publish (payload for the installer)
        shell: pwsh
        run: |
          $publishArgs = @(
            'publish', 'src/RavensPort.App/RavensPort.App.csproj',
            '-p:PublishProfile=win-x64-selfcontained',
            '-c', 'Release',
            '-p:EnableCompressionInSingleFile=false',
            '-p:PublishDir=bin\Release\net10.0-windows\publish\win-x64-raw\'
          )
          & dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "First publish attempt failed - retrying once (WPF markup-compile race)"
            & dotnet @publishArgs
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          # GITHUB_REF_NAME is the tag itself (e.g. "v1.2.0") when triggered by a tag push.
          $version = $env:GITHUB_REF_NAME
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # The Microsoft Store submission needs an installer, not the application: it runs this
      # unattended and then looks for the product on the machine. The bare exe installed nothing,
      # which is what failed certification under 10.1.2.10, 10.2.7 and 10.3.4 — see
      # docs/STORE-SUBMISSION.md. Inno Setup ships on the windows runner images.
      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          # The tag carries a leading "v"; Inno's AppVersion and VersionInfoVersion want digits.
          $version = "${{ steps.version.outputs.version }}" -replace '^v', ''

          $setup = ./installer/build.ps1 `
            -Version $version `
            -SourceExe 'src/RavensPort.App/bin/Release/net10.0-windows/publish/win-x64-raw/RavensPort.exe' `
            | Select-Object -Last 1

          echo "setupPath=$setup" >> $env:GITHUB_OUTPUT

      # --- Gate: nothing ships unscanned --------------------------------------------------------
      # installer-scan.yml runs these same two scripts on every pull request and on this tag, so in
      # the ordinary course of events they have already passed by the time this job starts. They
      # run again here because that workflow is a separate run: it can be skipped, cancelled, or
      # simply not have finished, and none of those should be able to put an installer in front of
      # a user. A failure here stops the job, so no release is created and no asset is attached.
      #
      # They are also the two checks winget's validation pipeline applies -- a Defender scan of the
      # installer, then an unattended install, launch, and uninstall on a clean machine -- which
      # makes a green release a package already known to survive submission. See
      # docs/WINGET-SUBMISSION.md.
      - name: Scan the installer with Microsoft Defender
        shell: pwsh
        run: ./installer/scan-installer.ps1 -Path '${{ steps.installer.outputs.setupPath }}'

      - name: Install, launch, and uninstall the installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}" -replace '^v', ''
          ./installer/test-install.ps1 -SetupExe '${{ steps.installer.outputs.setupPath }}' -Version $version

      # The number winget publishes, taken from the file that just passed the two gates above.
      #
      # It has to be captured here rather than recomputed later, and that is the whole point: an
      # installer built a second time from the same commit hashes differently, because Inno embeds
      # a timestamp and the compression is not bit-reproducible. So there is exactly one build whose
      # hash is the right one -- this one -- and it is the one being uploaded a few steps down.
      # Recording it now is what makes the manifest PR below trustworthy instead of a guess.
      - name: Hash the installer
        id: hash
        shell: pwsh
        env:
          SETUP_PATH: ${{ steps.installer.outputs.setupPath }}
        run: |
          $sha = (Get-FileHash -Algorithm SHA256 -Path $env:SETUP_PATH).Hash
          $name = Split-Path -Leaf $env:SETUP_PATH
          echo "sha256=$sha" >> $env:GITHUB_OUTPUT
          echo "setupName=$name" >> $env:GITHUB_OUTPUT
          Write-Host "$name  SHA256 $sha"

      # --- Microsoft Store package -------------------------------------------------------------
      # The Store submission is this MSIX, not the installer above. Policy 10.2.9 requires every PE
      # in an EXE/MSI submission to be signed by a CA in the Microsoft Trusted Root Program, and the
      # installer is not — that is what the 4.1.5 submission was rejected for. Microsoft signs MSIX
      # packages itself during ingestion, at no cost, so the package this builds is deliberately
      # left unsigned; signing it here would get the upload rejected instead, because the
      # certificate subject would not match the publisher Partner Center has on file.
      #
      # A third publish, because this one wants the opposite of the other two: loose files rather
      # than a single file, so MSIX can compress and block-dedupe the payload itself and a Store
      # update sends only the blocks that changed. See the win-x64-msix profile.
      #
      # StoreBuild=true is what removes Proton Pass (10.1.5) and mTLS with its certificate
      # generation (10.2.10, 10.2.10.1) — the features certification rejected. It is passed here
      # rather than set in the .pubxml on purpose: publish-profile properties do not cross a
      # ProjectReference, so a profile-set flag would build RavensPort.App without those features
      # and RavensPort.Core with them. build-msix.ps1 refuses to pack a payload that was not built
      # with it, so this cannot be dropped silently. The two publishes above deliberately do not
      # pass it: the installer and its EXE ship the whole app, unchanged.
      - name: Publish (payload for the Store package)
        shell: pwsh
        run: |
          $publishArgs = @(
            'publish', 'src/RavensPort.App/RavensPort.App.csproj',
            '-p:PublishProfile=win-x64-msix',
            '-p:StoreBuild=true',
            '-c', 'Release'
          )
          & dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "First publish attempt failed - retrying once (WPF markup-compile race)"
            & dotnet @publishArgs
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Build Store package (MSIX)
        id: msix
        shell: pwsh
        run: |
          # Same de-v as the installer. build-msix.ps1 pads to the four parts MSIX requires and
          # keeps the fourth at 0, which the Store reserves.
          $version = "${{ steps.version.outputs.version }}" -replace '^v', ''

          $package = ./packaging/build-msix.ps1 `
            -Version $version `
            -PublishDir 'src/RavensPort.App/bin/Release/net10.0-windows/publish/win-x64-msix' `
            | Select-Object -Last 1

          echo "packagePath=$package" >> $env:GITHUB_OUTPUT

      # Records which workflow, commit, and runner produced this exact exe, signed via the
      # job's OIDC identity. The free stand-in for Authenticode signing: it does not stop
      # SmartScreen warnings, but it does make the binary tamper-evident, so a downloaded exe
      # can be checked against the build that claims to have produced it:
      #
      #   gh attestation verify RavensPort-Setup-<version>.exe --repo ${{ github.repository }}
      #
      # Both artifacts, so neither can be published unattested. The attestation says nothing about
      # the copy the Store serves — Microsoft re-signs that during ingestion — it covers the file
      # downloaded from here.
      #
      # Placed before the release step so an artifact never gets published unattested.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ steps.installer.outputs.setupPath }}
            ${{ steps.msix.outputs.packagePath }}

      # `gh release create` rather than a release action, which is what zizmor's superfluous-actions
      # rule was pointing at: the GitHub CLI is preinstalled on the runner, so the action was a
      # third-party dependency doing something the runner already does — inside the one job that
      # holds contents: write, id-token: write and attestations: write, and at the last step, where
      # it decides what bytes get published under this repo's name. The same trade zizmor.yml makes
      # for zizmor itself, for the same reason.
      #
      # Every value is passed through env rather than interpolated into the script, so a tag name
      # is data the shell never parses. The tag is the trigger for this workflow, and pushing one
      # takes write access, but "only a trusted person can reach it" is the argument that stops
      # being true first.
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          # Two assets: the installer for people installing outside the Store, and the MSIX to
          # upload to Partner Center.
          SETUP_PATH: ${{ steps.installer.outputs.setupPath }}
          MSIX_PATH: ${{ steps.msix.outputs.packagePath }}
        run: |
          gh release create $env:VERSION `
            --title $env:VERSION `
            --generate-notes `
            $env:SETUP_PATH `
            $env:MSIX_PATH
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # --- winget ---------------------------------------------------------------------------------
  # Opens the microsoft/winget-pkgs pull request for the version that was just released.
  #
  # A separate job, and deliberately after the release exists: the manifest carries the installer's
  # download URL, and winget's validation pipeline fetches it. Submitting before `gh release create`
  # has run would put a 404 in front of it.
  #
  # It cannot recompute anything the job above measured. The hash in particular has to be the one
  # taken from the artifact that was uploaded -- Inno embeds a timestamp and its compression is not
  # bit-reproducible, so rebuilding the same commit gives a different hash and the submission would
  # fail validation on a file nobody can reproduce. Hence the outputs on the job above.
  #
  # ubuntu, unlike everything above it: this only edits YAML and calls the GitHub API.
  winget-manifests:
    name: Open the winget-pkgs pull request
    needs: test-build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing is pushed to this repository. The fork this submits through is reached with the
          # PAT below, and leaving the checkout token in .git/config would only widen what a
          # compromised step could use.
          persist-credentials: false

      # The version, URL, hash, release date and release-notes link. Everything else in those files
      # is hand-written prose explaining why a value is what it is, and it survives -- winget-pkgs
      # keeps the comments in what it merges.
      - name: Render the manifests for this release
        env:
          VERSION: ${{ needs.test-build-release.outputs.version }}
          SHA256: ${{ needs.test-build-release.outputs.sha256 }}
        run: |
          python3 packaging/update-winget-manifests.py \
            --version "${VERSION#v}" \
            --sha256 "$SHA256" \
            --repo "${{ github.repository }}"
          git --no-pager diff --stat

      # The same check installer-scan.yml runs on every pull request, against the same published
      # schemas. Repeated here because what it is checking is different now: there, the committed
      # manifests; here, the ones this job just rewrote.
      - name: Validate the rendered manifests
        run: |
          python3 -m pip install --quiet pyyaml jsonschema
          python3 packaging/validate-winget-manifests.py packaging/winget

      # Submitting needs a PAT: it pushes to a fork of winget-pkgs, which this repository's own
      # GITHUB_TOKEN has no rights over. Absent, the job stops here rather than failing -- the
      # release itself is already published and complete, and a missing optional credential is not
      # a reason to paint a green release red. The summary says what to do about it.
      #
      # `secrets` cannot be read from a job-level `if`, which is why this is a step.
      - name: Check for the submission token
        id: token
        env:
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
          VERSION: ${{ needs.test-build-release.outputs.version }}
          SHA256: ${{ needs.test-build-release.outputs.sha256 }}
        run: |
          if [ -n "$WINGET_PKGS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### winget submission skipped"
              echo
              echo 'No `WINGET_PKGS_TOKEN` secret is set, so the winget-pkgs pull request was not opened.'
              echo 'The release itself published normally.'
              echo
              echo 'To enable it: create a **classic** PAT with the `public_repo` scope at'
              echo 'https://github.com/settings/tokens, then add it as the `WINGET_PKGS_TOKEN`'
              echo 'repository secret. Fine-grained tokens cannot do this — the pull request is'
              echo 'opened against `microsoft/winget-pkgs`, which you cannot scope one to.'
              echo 'See `docs/WINGET-SUBMISSION.md`.'
              echo
              echo 'To submit this version by hand in the meantime:'
              echo
              echo '```'
              echo "python packaging/update-winget-manifests.py --version ${VERSION#v} --sha256 $SHA256"
              echo "python packaging/submit-winget-pr.py --version ${VERSION#v} --fork <you>/winget-pkgs"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open the pull request
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
          VERSION: ${{ needs.test-build-release.outputs.version }}
        run: |
          fork="$(gh api user --jq .login)/winget-pkgs"
          python3 packaging/submit-winget-pr.py \
            --version "${VERSION#v}" \
            --fork "$fork" \
            --repo "${{ github.repository }}" | tee -a "$GITHUB_STEP_SUMMARY"
