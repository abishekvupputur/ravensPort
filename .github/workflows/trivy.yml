name: Trivy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 0' # Run weekly

# Third-party actions are pinned to commit SHAs, not tags. A tag — and `master` most of all —
# is mutable: whoever controls the action's repo can repoint it at new code that then runs
# inside this job with the repo checked out. The trailing comment records which version each
# SHA was, since the SHA alone is unreadable.
#
# The Trivy *binary* is the deliberate exception, and it is a different kind of dependency from the
# action that fetches it. A scanner's value is its vulnerability database and its detection logic,
# both of which only move forward; a pinned Trivy quietly stops recognising package formats and
# advisory sources that shipped after it, and the failure mode is a green check rather than an
# error. `latest` is used everywhere below for that reason. The action wrapping it stays SHA-pinned
# — that one runs code in this job, and it holds security-events: write.
permissions:
  contents: read
  # Required by upload-sarif. Scoped to this job only; nothing else here writes anywhere.
  security-events: write

jobs:
  trivy_scan:
    name: Run Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to the repo, so don't leave GITHUB_TOKEN sitting in
          # .git/config where any later step or action could read it.
          persist-credentials: false

      # One pass over all three scanners, written to SARIF and uploaded to the Security tab; the
      # gating steps below re-run them for the log. The split is the point.
      #
      # Before this, every Trivy finding existed only as text in a job log: no history, no way to
      # dismiss a reviewed finding with a reason, no inline annotation on the pull request that
      # introduced it, and nothing at all once the log aged out. The table steps also stop at the
      # first scanner that fails, so a secret could hide a misconfiguration for a whole run.
      #
      # No severity filter here, unlike the gates. A MEDIUM is not worth blocking a merge on and is
      # worth being able to look at; the Security tab is where the full picture belongs, and
      # exit-code 0 keeps this step from ever being the thing that fails the build.
      - name: Run Trivy (SARIF, for code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'latest'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          format: 'sarif'
          output: 'trivy-results.sarif'
          # Matches the gate below. An advisory with no fixed version upstream is not something a
          # pull request here can act on, and filing it as an alert only trains people to ignore
          # the tab.
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF
        # The scan step cannot fail (exit-code 0), but a cache or network fault can. Uploading
        # whatever was produced is still better than losing the run.
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: 'trivy-results.sarif'
          # Keeps these alerts in their own bucket, so a CodeQL run never looks like it resolved
          # a Trivy finding or the other way round.
          category: 'trivy'

      # Every severity, not just CRITICAL and HIGH. A LOW advisory in a dependency of a thing that
      # holds credentials is still a known way in, and the fix for one is the same as the fix for a
      # CRITICAL: bump the package. The tree is clean at every level as of this commit, so the cost
      # of this is a build that fails the first time any advisory lands rather than the first time a
      # bad one does -- which is the trade being made deliberately, not a threshold nobody set.
      #
      # ignore-unfixed stays. An advisory with no fixed version upstream cannot be acted on from
      # here, and failing the build on one leaves no way forward except switching the gate off.
      - name: Run Trivy Vulnerability Scanner
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'latest'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'table'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # No severity filter, deliberately. Trivy grades secrets, but a committed credential is not
      # less leaked for being graded MEDIUM -- the fix is the same and it is always urgent. Filtering
      # to CRITICAL,HIGH meant anything below that was found, discarded, and never printed.
      - name: Run Trivy Secret Scanner
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'latest'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'table'
          exit-code: '1'

      # Licences, gated at CRITICAL and HIGH -- which for this scanner means Trivy's "forbidden" and
      # "restricted" classes, the copyleft terms an MIT binary shipped as an installer cannot absorb.
      #
      # The one step here that is not gated on every severity, and the reason is that Trivy's licence
      # severities are not risk grades at all: they are the classification itself. MIT, BSD and
      # Apache come back as LOW/notice, so a gate at LOW fails the build on correctly-licensed
      # permissive dependencies -- 12 of them in this tree today -- and would have to be switched off
      # within a day. CRITICAL and HIGH are the two classes that actually mean "this licence is a
      # problem for this project".
      #
      # TRIVY_LICENSE_FULL is not optional here, and this is the part worth knowing. Without it
      # Trivy reads licence metadata out of the lock files, and neither packages.lock.json nor
      # go.sum carries any: a scan without the flag reports "-" against every single target and
      # passes, which looks exactly like a clean result. With it, Trivy reads the licence texts and
      # headers themselves and finds 35 declarations in this tree. The action has no input for the
      # flag, so it goes through the environment, which is how every Trivy flag can be set.
      #
      # As of this commit all of them are permissive -- 12 notice-class, the rest unclassified, and
      # nothing above LOW -- so this step reports nothing today. It is not decorative: it is the
      # check that fires the day a GPL package arrives underneath something. dependency-review.yml
      # gates licences too, but only on what a pull request adds and only when GitHub can classify
      # the package; this one looks at everything already in the tree.
      #
      # No SARIF from this one, unlike the scanners above. Every finding it has is a permissive
      # licence correctly detected, and filing a dozen of those as security alerts is the noise the
      # other severity thresholds here exist to avoid. If a restricted licence ever does land, this
      # step fails the build, which is louder than an alert.
      - name: Run Trivy License Scanner
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_LICENSE_FULL: 'true'
        with:
          version: 'latest'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'license'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # 'misconfig' is the current name; 'config' is the old spelling, which Trivy still accepts
      # while logging a deprecation warning. Renaming it silences that warning and nothing else.
      #
      # This step reports "-" (not scanned) against every target, and that is correct rather than
      # broken: Trivy's misconfiguration scanner covers Terraform, CloudFormation, Kubernetes,
      # Dockerfile, Helm and Azure ARM, and this repository contains none of them -- the log says
      # "Detected config files num=0". GitHub Actions workflows are not in that set, so nothing here
      # lints them; that is what zizmor.yml is for.
      #
      # Kept anyway. It costs seconds, and the day a Dockerfile or a Helm chart lands in this repo
      # is the day it starts earning its place, with nobody having to remember to add it.
      - name: Run Trivy Misconfiguration Scanner
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'latest'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'misconfig'
          format: 'table'
          # Every severity, matching the vulnerability gate above. Currently academic -- this
          # scanner finds no config files to grade at all -- but it means the thresholds do not
          # disagree with each other the day one of those files appears.
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '1'
