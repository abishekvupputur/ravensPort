name: Pages

# Publishes https://abishekvupputur.github.io/ravensPort/: site/index.html as the landing page and
# the wiki rendered under docs/. The wiki stays where documentation is written; `gollum` is the event
# a wiki edit raises, so the site follows it without anyone remembering to rebuild.
#
# Pull requests build the site without deploying it, so a change to the generator or the landing
# page is checked before it reaches main. The built site is attached to the run as an artifact.

on:
  push:
    branches: [ "main" ]
    paths: [ "site/**", "media/**", ".github/workflows/pages.yml" ]
  # Every pull request, not only those touching the site: the apt-install jobs below are required
  # checks on main, and a required check whose workflow never starts blocks the merge for good.
  pull_request:
    branches: [ "main" ]
  gollum:
  workflow_dispatch:

permissions:
  contents: read

# A deploying run holds `github-pages` from start to finish, shared with deb.yml's apt-repository
# job, the other deployer of this site. Held for the whole run, not just the deploy job, because the
# build job copies apt/: a release published between that copy and the deploy would otherwise be
# rolled back to the previous package. Pull request builds deploy nothing and run side by side.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'github-pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The wiki is its own git repository, alongside this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Locked mode for the same reason the app restores that way: Markdig resolves to the version
      # and content hash in site/packages.lock.json, or the build fails.
      - name: Build site
        run: dotnet run site/build.cs -p:RestoreLockedMode=true -- wiki _site

      # deb.yml publishes the apt repository to this same Pages site, and a deploy replaces the
      # whole site, so this one would delete apt/ and break `apt update` for everyone who installed
      # it. The live repository is copied over byte for byte instead: it is signed, so it cannot be
      # rebuilt here without the signing key, and an exact copy keeps that signature valid. The
      # hashes in the signed Release file are checked so a partial download is never deployed.
      #
      # Runs on pull requests too, where it deploys nothing but shows the copy still works.
      - name: Keep the apt repository
        run: |
          base=https://abishekvupputur.github.io/ravensPort/apt
          if ! curl -fsS -o /dev/null "$base/InRelease"; then
            echo "No apt repository is published yet; nothing to keep"
            exit 0
          fi
          mkdir -p _site/apt
          cd _site/apt
          for f in InRelease Release Release.gpg Packages Packages.gz ravensport.asc; do
            curl -fsSL --retry 3 -o "$f" "$base/$f"
          done
          # Only the indexes: releases published before deb.yml stopped it list Release itself, hashed
          # while it was still empty.
          awk '/^SHA256:/ { s = 1; next } /^[^ ]/ { s = 0 } s && $3 ~ /^Packages/ { print $1 "  " $3 }' Release | sha256sum -c
          for f in $(awk '/^Filename:/ { sub(/^\.\//, "", $2); print $2 }' Packages); do
            # Only a bare package name: a path from a downloaded file never chooses where we write.
            [[ "$f" =~ ^[A-Za-z0-9._+-]+\.deb$ ]] || { echo "Unexpected Filename: $f" >&2; exit 1; }
            curl -fsSL --retry 3 -o "$f" "$base/$f"
          done
          awk '/^Filename:/ { sub(/^\.\//, "", $2); f = $2 } /^SHA256:/ { print $2 "  " f }' Packages | sha256sum -c

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # The install instructions on the Linux build page, run as written in a clean Ubuntu, on both
  # architectures the repository serves — once against the live site and once against the site this
  # run is about to deploy, served at the same path. Only the host differs between the two. The
  # second is the one that gates the deploy: a site whose apt/ cannot be installed from never
  # replaces one that can.
  apt-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, ubuntu-24.04-arm ]
        site: [ live, this-build ]
    runs-on: ${{ matrix.runner }}
    # The live check reports; it does not block. If the live site is broken, this deploy is the fix.
    continue-on-error: ${{ matrix.site == 'live' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.site == 'this-build'
        with:
          name: github-pages

      - name: Serve this build at /ravensPort/
        if: matrix.site == 'this-build'
        run: |
          mkdir -p srv/ravensPort
          tar -xf artifact.tar -C srv/ravensPort
          python3 -m http.server 8000 --bind 127.0.0.1 --directory srv > /dev/null 2>&1 &
          curl -fsS --retry 10 --retry-connrefused -o /dev/null http://127.0.0.1:8000/ravensPort/apt/InRelease

      - name: Install as the docs say
        env:
          BASE: ${{ matrix.site == 'live' && 'https://abishekvupputur.github.io/ravensPort' || 'http://127.0.0.1:8000/ravensPort' }}
        run: |
          docker run --rm --network host -e BASE ubuntu:24.04 bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq sudo curl ca-certificates > /dev/null

            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL "$BASE/apt/ravensport.asc" \
              | sudo tee /etc/apt/keyrings/ravensport.asc > /dev/null
            echo "deb [signed-by=/etc/apt/keyrings/ravensport.asc] $BASE/apt ./" \
              | sudo tee /etc/apt/sources.list.d/ravensport.list
            sudo apt update 2>&1 | tee update.log

            # apt update reports a bad signature or an unreadable index as a warning and carries on,
            # so its exit code proves nothing about this repository.
            if grep -iE "^(W|E|Err):.*ravensport" update.log; then
              echo "apt update complained about the RavensPort repository" >&2
              exit 1
            fi

            sudo apt install -y ravensport
            dpkg -s ravensport | grep -E "^(Version|Architecture):"
            command -v ravensport
          '

  deploy:
    if: github.event_name != 'pull_request'
    needs: [ build, apt-install ]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
