name: Pages

# Publishes https://abishekvupputur.github.io/ravensPort/: site/index.html as the landing page and
# the wiki rendered under docs/. The wiki stays where documentation is written; `gollum` is the event
# a wiki edit raises, so the site follows it without anyone remembering to rebuild.
#
# Pull requests build the site without deploying it, so a change to the generator or the landing
# page is checked before it reaches main. The built site is attached to the run as an artifact.

on:
  push:
    branches: [ "main" ]
    paths: [ "site/**", "media/**", ".github/workflows/pages.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "site/**", "media/**", ".github/workflows/pages.yml" ]
  gollum:
  workflow_dispatch:

permissions:
  contents: read

# A deploying run holds `github-pages` from start to finish, shared with deb.yml's apt-repository
# job, the other deployer of this site. Held for the whole run, not just the deploy job, because the
# build job copies apt/: a release published between that copy and the deploy would otherwise be
# rolled back to the previous package. Pull request builds deploy nothing and run side by side.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'github-pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The wiki is its own git repository, alongside this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Locked mode for the same reason the app restores that way: Markdig resolves to the version
      # and content hash in site/packages.lock.json, or the build fails.
      - name: Build site
        run: dotnet run site/build.cs -p:RestoreLockedMode=true -- wiki _site

      # deb.yml publishes the apt repository to this same Pages site, and a deploy replaces the
      # whole site, so this one would delete apt/ and break `apt update` for everyone who installed
      # it. The live repository is copied over byte for byte instead: it is signed, so it cannot be
      # rebuilt here without the signing key, and an exact copy keeps that signature valid. The
      # hashes in the signed Release file are checked so a partial download is never deployed.
      #
      # Runs on pull requests too, where it deploys nothing but shows the copy still works.
      - name: Keep the apt repository
        run: |
          base=https://abishekvupputur.github.io/ravensPort/apt
          if ! curl -fsS -o /dev/null "$base/InRelease"; then
            echo "No apt repository is published yet; nothing to keep"
            exit 0
          fi
          mkdir -p _site/apt
          cd _site/apt
          for f in InRelease Release Release.gpg Packages Packages.gz ravensport.asc; do
            curl -fsSL --retry 3 -o "$f" "$base/$f"
          done
          # Only the indexes: releases published before deb.yml stopped it list Release itself, hashed
          # while it was still empty.
          awk '/^SHA256:/ { s = 1; next } /^[^ ]/ { s = 0 } s && $3 ~ /^Packages/ { print $1 "  " $3 }' Release | sha256sum -c
          for f in $(awk '/^Filename:/ { sub(/^\.\//, "", $2); print $2 }' Packages); do
            # Only a bare package name: a path from a downloaded file never chooses where we write.
            [[ "$f" =~ ^[A-Za-z0-9._+-]+\.deb$ ]] || { echo "Unexpected Filename: $f" >&2; exit 1; }
            curl -fsSL --retry 3 -o "$f" "$base/$f"
          done
          awk '/^Filename:/ { sub(/^\.\//, "", $2); f = $2 } /^SHA256:/ { print $2 "  " f }' Packages | sha256sum -c

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
