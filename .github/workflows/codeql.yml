name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # The repository requires Windows for C# because of WPF usage, and the Go DLL is built with CGO
    # against the Windows toolchain. 'actions' compiles nothing, so it has no reason to occupy a
    # Windows runner -- those are billed at ten times the Linux rate on private repos and are slower
    # to start on public ones.
    runs-on: ${{ matrix.language == 'actions' && 'ubuntu-latest' || 'windows-latest' }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # 'actions' analyses the workflows in this repository as code, which is what they are: they
        # run with the tree checked out and, in release.yml, with contents: write. zizmor.yml audits
        # the same files and this is not redundant with it -- zizmor pattern-matches known-dangerous
        # Actions constructs, while CodeQL builds a dataflow graph and follows untrusted input from a
        # trigger through to a sink, which is how an injection that no single line looks wrong in
        # gets found.
        language: [ 'csharp', 'go', 'actions' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # CodeQL only reads the tree; it never pushes. Keeping GITHUB_TOKEN out of
        # .git/config means a later step or action cannot lift it from there.
        persist-credentials: false

    # Set up specific language environments
    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: "8.0.x"

    - name: Setup Go
      if: matrix.language == 'go'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # go.mod is the only place the Go version is written down. Pinning it here as
        # well drifts: setup-go v5 hid that by letting the toolchain download whatever
        # go.mod asked for, and v6 runs GOTOOLCHAIN=local, so a stale pin now fails.
        go-version-file: src/OnePasswordNative/go.mod
        # The module lives under src/, so the default repository-root lookup finds no
        # go.sum and the module cache is silently skipped.
        cache-dependency-path: src/OnePasswordNative/go.sum

    # Initializes the CodeQL tools for scanning.
    # SHA-pinned like every other third-party action here. These two were on the mutable @v4 tag,
    # which the rest of this repository deliberately avoids: whoever controls the action's repo can
    # repoint a tag at new code, and this job holds security-events: write.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      with:
        languages: ${{ matrix.language }}
        # Autobuild triggers clean-build.bat, which launches the app and hangs, so the two compiled
        # languages are built by the explicit steps below.
        #
        # This is what produces the "Cannot build an overlay-base database because build-mode is
        # set to manual instead of none" notice in the log. It is informational, not a failure:
        # overlay databases are a caching optimisation that only applies to build-mode none, and
        # CodeQL says itself that it falls back to a normal full database — which is the more
        # thorough analysis, not a degraded one. Silencing it would mean switching C# to buildless
        # analysis and giving up the real compilation this project's WPF and P/Invoke code is
        # actually checked against. Left as it is on purpose.
        #
        # 'actions' is the exception and has to be none: there is nothing to compile, and CodeQL
        # refuses build-mode manual for it outright rather than ignoring it.
        build-mode: ${{ matrix.language == 'actions' && 'none' || 'manual' }}
        # security-extended over the default suite. The default is tuned for a low false-positive
        # rate on any repository at all; extended adds the queries that trade some precision for
        # reach, which is the right trade for something that holds credentials, brokers OAuth
        # tokens and P/Invokes into CNG. security-and-quality is deliberately not included -- its
        # extra queries are maintainability findings, and filing those as security alerts is how
        # the Security tab becomes something nobody opens.
        queries: security-extended

    - name: Build Go DLL (Required for C#)
      if: matrix.language == 'csharp'
      shell: pwsh
      run: |
        cd src/OnePasswordNative
        $env:CGO_ENABLED = "1"
        go build -buildmode=c-shared -o onepassword.dll main.go

    - name: Build C#
      if: matrix.language == 'csharp'
      run: |
        dotnet restore RavensPort.slnx --locked-mode
        dotnet build RavensPort.slnx -c Release --no-restore

    - name: Build Go
      if: matrix.language == 'go'
      shell: pwsh
      run: |
        cd src/OnePasswordNative
        $env:CGO_ENABLED = "1"
        go build -buildmode=c-shared -o onepassword.dll main.go

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      with:
        category: "/language:${{matrix.language}}"
