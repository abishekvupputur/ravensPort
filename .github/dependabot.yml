version: 2

# Continuous dependency monitoring, as opposed to the periodic inspection the scanners in
# .github/workflows do. Those answer "is anything vulnerable right now"; this one opens a pull
# request the day an upstream fix ships, so the answer stays no without anyone remembering to look.
#
# Note what this file does NOT control. Dependabot *alerts* and *security updates* are repository
# settings, not configuration: Settings -> Advanced Security -> Dependency graph, Dependabot alerts,
# Dependabot security updates. All three have to be on in the UI. This file only configures version
# updates -- the routine bumps -- and is inert until the dependency graph is enabled.
updates:
  # One entry per project directory rather than a single "/" entry. NuGet discovery from the root
  # depends on Dependabot finding the solution, and RavensPort.slnx is an slnx rather than an sln,
  # which is new enough not to rely on.
  - package-ecosystem: "nuget"
    directories:
      - "/src/RavensPort.App"
      - "/src/RavensPort.Core"
      - "/tests/RavensPort.Core.Tests"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a version that has just shipped.
    #
    # The attack this closes is the one every recent supply-chain incident used: a maintainer
    # account is compromised, a malicious version is published, and it is yanked within a day or
    # two once someone notices. Without a cooldown Dependabot opens a pull request for that version
    # within hours, and a grouped patch bump with a green CI run is precisely the pull request that
    # gets merged without anyone reading the diff. A week is long enough that the bad releases are
    # gone before they are ever proposed here.
    #
    # Applies to version updates only. Dependabot *security* updates ignore cooldown, which is the
    # behaviour wanted: a fix for a known advisory should not be held back for a week.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One PR for a wave of patch bumps instead of five. Security updates are unaffected -- those
      # come through the security-updates channel and are never grouped or delayed.
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/src/OnePasswordNative"
    schedule:
      interval: "weekly"
    # Same reasoning as the NuGet block above.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"

  # The workflows pin every third-party action to a commit SHA, which is what stops a mutable tag
  # being repointed at new code inside a job holding contents:write. Dependabot understands that
  # convention: it bumps the SHA and rewrites the trailing version comment with it, so pinning does
  # not turn into never updating.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Same reasoning again, and this is the ecosystem where it matters most: an action bump is a
    # SHA nobody can read, running with the repository checked out and, in release.yml, with
    # contents: write.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
